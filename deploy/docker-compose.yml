# Hệ thống MedKG: db (PostgreSQL) · api (FastAPI + mô hình) · web (Nginx + React)
#   cd deploy
#   cp .env.example .env        # (PowerShell: Copy-Item .env.example .env) rồi sửa mật khẩu, MODEL_DIR
#   docker compose up -d --build
#   -> http://localhost:8080   (API: http://localhost:8080/api/docs)
name: medkg

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medkg}
      POSTGRES_USER: ${POSTGRES_USER:-medkg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: medkg-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medkg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medkg}
      NER_MODEL: ${NER_MODEL:-vihealthbert-ner-vietmed-v2-final}
      RE_MODEL: ${RE_MODEL:-vihealthbert-re-vietmed-811}
      DEVICE: ${DEVICE:-cpu}
      TORCH_THREADS: ${TORCH_THREADS:-4}
      LOAD_MODELS: ${LOAD_MODELS:-true}
      SEED_FILE: ${SEED_FILE-/app/seed/results.jsonl}
      MAX_CHARS: ${MAX_CHARS:-2000}
    volumes:
      - ${MODEL_DIR:-../Model}:/models:ro
      - normcache:/app/normalization/data   # bộ đệm RxNorm (SQLite) giữ qua các lần khởi động lại
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-6g}

  web:
    build:
      context: ../frontend
    image: medkg-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  normcache:
