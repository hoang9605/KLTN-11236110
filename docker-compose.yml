# MedKG bản demo: một service duy nhất.
#   docker compose up -d --build        -> http://localhost:8080
# Thư mục mô hình mặc định là ./Model. Trên máy dự án (Windows) đặt trước:  $env:MODEL_DIR = "./Code/Model"
name: medkg

services:
  medkg:
    build: .
    image: medkg:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      TORCH_THREADS: ${TORCH_THREADS:-4}
    volumes:
      - ${MODEL_DIR:-./Model}:/models:ro
      - medkg-data:/data   # tệp SQLite lịch sử phân tích, giữ qua các lần khởi động lại

volumes:
  medkg-data:
